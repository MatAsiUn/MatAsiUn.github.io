<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found</title>
  <script>
    // Pick the theme before the page draws: the saved choice, otherwise the computer's setting.
    (function () {
      let theme = null;
      try { theme = localStorage.getItem("theme"); } catch (error) {}
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <!-- Root-relative paths, so this page works at any missing URL -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#fff9e6">
</head>

<body>

  <header class="topbar">
    <a class="brand" href="/index.html">
      <span class="brand-mark" aria-hidden="true">MA</span>
      <span class="brand-text">
        <strong>Mateo Asin</strong>
      </span>
    </a>

    <nav class="nav" aria-label="Pages">
      <a href="/index.html" class="chip">Home</a>
      <a href="/cv.html" class="chip">CV</a>
      <a href="/tutoring.html" class="chip">Tutoring</a>
      <a href="/contact.html" class="chip">Contact</a>
    </nav>

    <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path fill="currentColor" d="M21 14.5A9 9 0 0 1 9.5 3a.6.6 0 0 0-.8-.7A10 10 0 1 0 21.7 15.3a.6.6 0 0 0-.7-.8Z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </g>
      </svg>
    </button>
  </header>

  <main class="page">
    <section class="hero card">
      <span class="eyebrow">404</span>
      <h1>Page Not Found</h1>
      <p class="lead">Sorry, but the page you were trying to view does not exist.</p>
      <div class="button-row">
        <a class="pill-button" href="/index.html">Back to home</a>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>

</body>

</html>
